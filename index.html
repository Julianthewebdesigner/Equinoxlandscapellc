    <!-- ── LeadConnector Chat Widget — deferred to keep mobile fast ─── -->
    <script>
      (function () {
        function load() {
          if (window.__leadconnectorLoaded) return;
          window.__leadconnectorLoaded = true;
          var s = document.createElement("script");
          s.src = "https://widgets.leadconnectorhq.com/loader.js";
          s.async = true;
          s.setAttribute(
            "data-resources-url",
            "https://widgets.leadconnectorhq.com/chat-widget/loader.js"
          );
          s.setAttribute("data-widget-id", "6a16720bb2d4c061bc553b76");
          s.setAttribute("data-source", "WEB_USER");
          document.body.appendChild(s);
        }
        // Load after first interaction OR ~4s after page becomes idle.
        var triggers = ["scroll", "touchstart", "mousemove", "keydown", "click"];
        function once() {
          triggers.forEach(function (e) {
            window.removeEventListener(e, once, { passive: true });
          });
          load();
        }
        triggers.forEach(function (e) {
          window.addEventListener(e, once, { passive: true, once: true });
        });
        window.addEventListener("load", function () {
          setTimeout(load, 4000);
        });
      })();
    </script>
